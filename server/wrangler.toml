name = "buildpilot-license"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# wrangler kv namespace create LICENSES  → paste the id below
[[kv_namespaces]]
binding = "LICENSES"
id = "REPLACE_WITH_KV_ID"

# Secrets (never in this file):
#   wrangler secret put STRIPE_WEBHOOK_SECRET   (from Stripe → Developers → Webhooks)
#   wrangler secret put LICENSE_PRIVATE_KEY     (contents of ~/.buildpilot-issuer/private.pem)
